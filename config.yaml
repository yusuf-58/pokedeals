# ===== PokeDeals instellingen =====

# Hoe vaak checken (seconden). 60 = elke minuut.
interval_seconds: 60

# Aantal nieuwste advertenties per zoekterm per ronde
# (bij GitHub Actions elke 5-10 min: 50 zodat je niks mist)
mp_limit: 100
mp_pages: 2              # pagina's per zoekterm (voorbij de betaalde dagtoppers)
# Achtergrondscan: elke run ook oudere advertenties bekijken (tot alles 1x bekeken is,
# daarna opnieuw; prijsverlagingen worden opnieuw bekeken)
backfill_pages: 3
backfill_max_offset: 3000

# Zoektermen op Marktplaats (nieuwste advertenties eerst).
# Elke zoekterm = 1 verzoek per ronde. Houd het klein (2-4).
searches:
  - "pokemon psa"
  - "pokemon kaart"
  - "pokemon kaarten"
  - "pokemon japans"
  - "pokemon holo"
  - "psa 10 pokemon"
  - "psa 9 pokemon"
  - "cgc pokemon"
  - "graded pokemon"

# Meldingen via Discord (aanrader). Webhook-URL als GitHub secret DISCORD_WEBHOOK,
# niet hier invullen (je repo is openbaar).
# Met knoppen (Claimen/Skippen): GitHub secrets DISCORD_BOT_TOKEN + DISCORD_CHANNEL_ID
# Zonder bot: alleen DISCORD_WEBHOOK (geen knoppen).
discord:
  webhook_url: ""

# Onderhandelen: geschat bod = % van vraagprijs
negotiation:
  your_name: "Yusuf"
  bid_pct: 80      # bij "bieden"-advertenties
  fixed_pct: 90    # bij vaste prijs

# (Optioneel) Telefoonmelding via de gratis ntfy-app (Android/iOS).
# Kies een lange geheime naam, abonneer je in de app op precies deze naam.
# Bij GitHub: zet hem als secret NTFY_TOPIC (dan blijft hij geheim).
ntfy:
  enabled: false
  server: "https://ntfy.sh"
  topic: "yusuf-pokemondeals"

# API keys. Mag ook via env vars / GitHub secrets: PPT_API_KEY
ppt_api_key: ""          # pokemonpricetracker.com = hoofdbron (raw + PSA). Gratis key.
# pokemontcg.io stopt (geen nieuwe keys). Werkt nog zonder key voor
# Cardmarket-prijzen; valt daarna vanzelf terug op pokemonpricetracker.
pokemontcg_api_key: ""
# eBay (gratis developer-account) voor slab-prijzen. Secrets: EBAY_CLIENT_ID + EBAY_CLIENT_SECRET
ebay:
  marketplace: "EBAY_DE"     # Europese prijzen in EUR (EBAY_NL kan ook)
  min_listings: 4            # minimaal zoveel vergelijkbare slabs nodig
  daily_budget: 4000         # max zoekopdrachten per dag (gratis limiet is 5000)

# PriceCharting (betaald): beste bron, prijzen per cijfer + sealed.
# Zet als GitHub secret PRICECHARTING_TOKEN (niet hier invullen).
pricecharting_token: ""
usd_to_eur: 0.92         # omrekening voor eBay-prijzen in dollars

# Wanneer is iets een deal?
min_profit_eur: 150      # minimaal zoveel netto winst (na alle kosten)
min_margin_pct: 10       # en minimaal zoveel % winst op je inkoop

# Kosten (pas aan naar jouw situatie)
costs:
  buy_shipping_eur: 5.0        # verzendkosten Marktplaats naar jou
  cardmarket_fee_pct: 5        # Cardmarket commissie bij verkoop raw
  cardmarket_ship_eur: 2.0     # verzenden raw kaart
  ebay_fee_pct: 13             # eBay fees bij verkoop graded
  ebay_ship_eur: 8.0           # verzenden slab (verzekerd)
  show_grading_option: false  # true = ook 'laten graden' winst tonen
  sealed_ship_eur: 10.0       # verzenden sealed product (verzekerd)
  grading_eur: 49.99           # PSA Europe Standard
  grading_ship_eur: 15.0       # heen/terug naar PSA, per kaart
  psa10_chance_pct: 35         # jouw gok kans op PSA 10 bij raw NM kaart

# Automatische modus: herkent ook kaarten buiten je watchlist
# via het kaartnummer in de titel (bv. "Pikachu 160/159").
auto_mode: true
use_tcgdex: true
# Kaart zonder nummer op naam raden? Onbetrouwbaar (gaf foute meldingen), dus uit.
title_only_matching: false
# Meer dan zoveel % winst bij een automatisch herkende kaart = bijna altijd verkeerde kaart
max_margin_pct: 300             # gratis Cardmarket-prijzen via TCGdex (hoofdbron Engelse kaarten)
# Ook advertenties ZONDER kaartnummer herkennen op titel (kost API-credits)
title_lookup_min_price: 15   # goedkopere advertenties niet opzoeken
ppt_daily_budget: 30         # max opzoekingen per dag (gratis tegoed = 100 credits, ~3 per opzoeking)

# Foto's lezen met AI voor advertenties zonder kaartnummers,
# bv. "pokemon kaarten verzameling". GRATIS via Google Gemini.
# Gratis key: aistudio.google.com -> "Get API key" (of env var GEMINI_API_KEY)
vision:
  enabled: true               # doet pas iets als GEMINI_API_KEY is ingesteld
  provider: "gemini"          # gratis. ("claude" kan ook, maar is betaald)
  gemini_api_key: ""
  model: "gemini-2.5-flash"   # check in AI Studio welke Flash-modellen gratis zijn
  max_images: 3               # foto's per advertentie
  max_per_day: 200            # blijf onder de gratis daglimiet
  min_listing_price: 10       # goedkopere advertenties niet scannen
  min_confidence: 0.75        # AI moet zo zeker zijn

# Rustig houden: deals worden verzameld en elke `batch_minutes` krijg je de beste `batch_size`.
batch_minutes: 15
batch_size: 3
slab_share: 0.7              # ~70% van de berichten zijn slabs (als die er zijn)
slab_title_matching: true    # slabs ook zonder kaartnummer herkennen (via pokemonpricetracker)
queue_max_age_hours: 3       # oudere deals uit de wachtrij vallen weg
instant_topdeals: true       # TOPDEAL (€300+) meteen sturen
check_bids: true             # bij bieden-advertenties eerst het hoogste bod checken
# Deals waarbij de exacte versie onzeker is (geen kaartnummer) ook melden?
allow_uncertain: false

# Advertenties zonder vraagprijs ("Bieden", "n.o.t.k.") met waardevolle kaart melden
bid_alerts: true
bid_alert_min_value: 0       # geen minimum: alleen of er €min_profit winst mogelijk is

# Dagoverzicht in Discord (uur, Nederlandse tijd). -1 = uit
daily_summary_hour: 21

skip_existing_on_first_run: false

# ===== Watchlist: kaarten waar de bot op let =====
# keywords: advertentie matcht als ÉÉN van deze zinnen in titel/omschrijving staat
# exclude:  woorden die een match afkeuren
# pokemontcg_id: (optioneel) id voor Cardmarket-prijs zolang pokemontcg.io werkt
# ppt_search: zoekterm voor pokemonpricetracker (naam + nummer)
# Handmatige waardes (EUR) overschrijven de API als je ze invult.
# Japanse kaart? Zet language: "japanese" (prijzen via pokemonpricetracker, ppt_api_key nodig)
watchlist:
  - name: "Umbreon VMAX Alt Art (Evolving Skies)"
    keywords: ["umbreon vmax 215", "moonbreon", "umbreon vmax alt", "215/203"]
    exclude: ["proxy", "fake", "replica", "custom", "orica"]
    pokemontcg_id: "swsh7-215"
    ppt_search: "Umbreon VMAX 215"
    raw_value_eur: null
    psa9_value_eur: null
    psa10_value_eur: null

  - name: "Umbreon VMAX 095/067 (Japans, Eevee Heroes)"
    keywords: ["umbreon vmax 095", "095/067"]
    exclude: ["proxy", "fake", "custom"]
    language: "japanese"
    ppt_search: "Umbreon VMAX 095/067"
    raw_value_eur: null
    psa9_value_eur: null
    psa10_value_eur: null

  - name: "Charizard Base Set Holo"
    keywords: ["charizard base set", "charizard 4/102", "glurak base"]
    exclude: ["proxy", "fake", "replica", "custom", "celebrations", "25th"]
    pokemontcg_id: "base1-4"
    ppt_search: "Charizard Base Set 4/102"
    raw_value_eur: null
    psa9_value_eur: null
    psa10_value_eur: null

  - name: "Giratina V Alt Art (Lost Origin)"
    keywords: ["giratina v alt", "giratina 186", "186/196"]
    exclude: ["proxy", "fake", "custom", "vstar"]
    pokemontcg_id: "swsh11-186"
    ppt_search: "Giratina V 186"
    raw_value_eur: null
    psa9_value_eur: null
    psa10_value_eur: null

  # ===== SEALED =====
  # type: sealed + value_eur = wat het op Cardmarket echt waard is (zelf invullen,
  # bv. laagste prijs van verkopers uit NL/DE). Zonder value_eur doet hij niks.
  # Advertenties met "leeg", "geopend", "resealed" enz. worden overgeslagen.
  - name: "Evolving Skies Booster Box"
    type: sealed
    keywords: ["evolving skies booster box", "evolving skies display", "evolving skies booster display"]
    exclude: ["leeg", "empty", "geopend", "opened"]
    value_eur: null

  - name: "151 Booster Bundle / ETB"
    type: sealed
    keywords: ["151 elite trainer box", "151 etb", "151 booster bundle"]
    exclude: ["leeg", "empty", "geopend", "opened"]
    value_eur: null

  - name: "Prismatic Evolutions ETB"
    type: sealed
    keywords: ["prismatic evolutions elite trainer box", "prismatic evolutions etb", "prismatic etb"]
    exclude: ["leeg", "empty", "geopend", "opened", "pokemon center"]
    value_eur: null

  - name: "Prismatic Evolutions ETB (Pokemon Center)"
    type: sealed
    keywords: ["prismatic evolutions pokemon center", "prismatic pc etb", "prismatic pokemon center etb"]
    exclude: ["leeg", "empty", "geopend", "opened"]
    value_eur: null

  - name: "Crown Zenith ETB"
    type: sealed
    keywords: ["crown zenith elite trainer box", "crown zenith etb"]
    exclude: ["leeg", "empty", "geopend", "opened"]
    value_eur: null

  - name: "Japanse VSTAR Universe Booster Box"
    type: sealed
    keywords: ["vstar universe booster box", "vstar universe box", "vstar universe display"]
    exclude: ["leeg", "empty", "geopend", "opened"]
    value_eur: null

  - name: "Japanse 151 Booster Box"
    type: sealed
    keywords: ["japanse 151 booster box", "151 japanese booster box", "pokemon card 151 booster box", "151 box jp"]
    exclude: ["leeg", "empty", "geopend", "opened"]
    value_eur: null
