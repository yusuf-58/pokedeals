name: PokeDeals

on:
  schedule:
    - cron: "7,37 * * * *"  # reserve; de Cloudflare Worker start hem elke 5 min
  workflow_dispatch:         # handmatig starten via de Actions-tab
    inputs:
      test:
        description: "Alleen testbericht sturen"
        type: boolean
        default: false

concurrency:
  group: pokedeals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # onthoud welke advertenties al gezien zijn
      - name: Database ophalen
        uses: actions/cache/restore@v4
        with:
          path: pokedeals.db
          key: pokedeals-db-${{ github.run_id }}
          restore-keys: pokedeals-db-

      - name: Scannen
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
          PPT_API_KEY: ${{ secrets.PPT_API_KEY }}
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POKEDEALS_DEBUG: "1"
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python pokedeals.py --test-notify
          else
            python pokedeals.py --once
          fi

      - name: Database opslaan
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pokedeals.db
          key: pokedeals-db-${{ github.run_id }}
